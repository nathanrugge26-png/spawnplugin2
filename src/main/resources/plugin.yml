name: SpawnPlugin
version: '1.0.0'
main: com.example.spawnplugin.SpawnPlugin
api-version: '1.21'
description: Adds /spawn (teleport) and /c (creative mode) commands.
author: YourName

commands:
  spawn:
    description: Teleports you to the spawn point.
    usage: /spawn
  c:
    description: Switches you into Creative mode.
    usage: /c
