name: SpawnPlugin
version: '1.0.0'
main: com.example.spawnplugin.SpawnPlugin
api-version: '1.21'
description: Adds /spawn, /c (creative), and /co (survival) commands.
author: YourName

commands:
  spawn:
    description: Teleports you to the spawn point.
    usage: /spawn
  c:
    description: Switches you into Creative mode.
    usage: /c
  co:
    description: Switches you into Survival mode.
    usage: /co
